openapi: 3.0.3

info:
  title: Organigrama Empresarial API
  version: 1.0.0
  description: API para gestionar un organigrama empresarial como estructura jerárquica tipo árbol.

servers:
  - url: http://localhost:8080/api/v1

paths:

  /nodes/root:
    post:
      summary: Crear nodo raíz

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRootRequest'

      responses:
        '200':
          description: Nodo raíz creado correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TreeNode'

  /nodes/{parentId}/children:
    post:
      summary: Agregar hijo a un nodo padre

      parameters:
        - name: parentId
          in: path
          required: true
          schema:
            type: integer
            format: int64

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateChildRequest'

      responses:
        '200':
          description: Nodo hijo creado correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TreeNode'

  /tree:
    get:
      summary: Obtener árbol completo

      responses:
        '200':
          description: Árbol obtenido correctamente
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TreeNode'

components:

  schemas:

    CreateRootRequest:
      type: object

      properties:
        value:
          type: string
          example: Gerencia

    CreateChildRequest:
      type: object

      properties:
        value:
          type: string
          example: Jefatura TI

    TreeNode:
      type: object

      properties:
        id:
          type: integer
          format: int64
          example: 1

        value:
          type: string
          example: Gerencia

        parentId:
          type: integer
          format: int64
          nullable: true
          example: null