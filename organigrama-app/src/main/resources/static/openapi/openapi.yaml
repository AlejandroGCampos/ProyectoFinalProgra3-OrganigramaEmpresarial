openapi: 3.0.3

info:
  title: Organigrama Empresarial API
  version: 1.0.0
  description: API para gestionar un organigrama empresarial como estructura jerárquica tipo árbol.

servers:
  - url: http://localhost:8080/api/v1

tags:
  - name: Tree
    description: Operaciones principales del árbol del organigrama

paths:

  /nodes/root:
    post:
      tags:
        - Tree
      summary: Crear nodo raíz
      operationId: createRoot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRootRequest'
      responses:
        '201':
          description: Nodo raíz creado correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TreeNode'
        '400':
          description: Solicitud inválida

  /nodes/{parentId}/children:
    post:
      tags:
        - Tree
      summary: Agregar hijo a un nodo padre
      operationId: addChild
      parameters:
        - name: parentId
          in: path
          required: true
          description: ID del nodo padre
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateChildRequest'
      responses:
        '201':
          description: Nodo hijo creado correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TreeNode'
        '400':
          description: Solicitud inválida
        '404':
          description: Nodo padre no encontrado

  /tree:
    get:
      tags:
        - Tree
      summary: Obtener árbol completo
      operationId: getTree
      responses:
        '200':
          description: Árbol obtenido correctamente
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TreeNode'

components:

  schemas:

    CreateRootRequest:
      type: object
      required:
        - value
      properties:
        value:
          type: string
          example: Gerencia

    CreateChildRequest:
      type: object
      required:
        - value
      properties:
        value:
          type: string
          example: Jefatura TI

    TreeNode:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        value:
          type: string
          example: Gerencia
        parentId:
          type: integer
          format: int64
          nullable: true
          example: null